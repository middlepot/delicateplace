<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delicate ♡ place</title>
    <link rel="shortcut icon" href="img/bow.png">
    <link rel="stylesheet" href="style.css?v=3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700');
</style>
</head>

<body>
    <div class="container index-layout">

        <div class="logo-container">
            <img src="img/construction.png" class="construction">
        </div>

    </div>

    <script>
        let isState1 = true;
        const leftBtn = document.querySelector('.top-left');
        const rightBtn = document.querySelector('.top-right');

        setInterval(() => {
            isState1 = !isState1;
            leftBtn.src = isState1 ? 'img/buttons1_left_index.png' : 'img/buttons2_left_index.png';
            rightBtn.src = isState1 ? 'img/buttons1_right_index.png' : 'img/buttons2_right_index.png';
        }, 500);
    </script>
</body>
