<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delicate ♡ place</title>
    <link rel="shortcut icon" href="img/bow.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="top-decorations">
            <img src="img/buttons1_left_index.png" class="top-left">
            <img src="img/buttons1_right_index.png" class="top-right">
        </div>

        <a href="roblox://placeId=129335976071987"><div class="logo-container">
            <img src="img/logo.png" class="logo">
            <img src="img/animation.gif" class="bear">
        </div></a>

        <div class="nav-links">
            <a href="about" class="nav-item"><img src="img/button_about.png"></a>
            <a href="project" class="nav-item"><img src="img/button_project.png"></a>
            <a href="updates" class="nav-item"><img src="img/button_updates.png"></a>
        </div>
    </div>

    <script>
        let isState1 = true;
        const leftBtn = document.querySelector('.top-left');
        const rightBtn = document.querySelector('.top-right');

        setInterval(() => {
            isState1 = !isState1;
            leftBtn.src = isState1 ? 'img/buttons1_left_index.png' : 'img/buttons2_left_index.png';
            rightBtn.src = isState1 ? 'img/buttons1_right_index.png' : 'img/buttons2_right_index.png';
        }, 500);
    </script>
</body>

</html>
