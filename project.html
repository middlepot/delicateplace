    <link rel="shortcut icon" href="img/bow.png">
    <link rel="stylesheet" href="style.css">

<body>
    <div class="container about-layout">

        <a href="roblox://placeId=129335976071987">
            <div class="logo-container about-logo">
                <img src="img/logo.png" class="logo">
                <img src="img/animation.gif" class="bear">
            </div>
        </a>

        <div class="about-center-wrapper">
            <img src="img/button_project.png" class="about-badge">

            <img src="img/buttons1_left_about.png" class="about-side-left">
            <img src="img/buttons1_right_about.png" class="about-side-right">

            <div class="about-content-box">
                <div align="center">
                    <div class="text-project" style="display: inline-block; text-align: left; line-height: 1.4;">
                <p>welcome to my imagination <sub><img src="img/delicate.png"></sub><br>

            </div></div>
        </div>
        </div>

    </div>

    <script>
        let isState1 = true;
        const leftBtn = document.querySelector('.about-side-left');
        const rightBtn = document.querySelector('.about-side-right');

        setInterval(() => {
            isState1 = !isState1;
            leftBtn.src = isState1 ? 'img/buttons1_left_about.png' : 'img/buttons2_left_about.png';
            rightBtn.src = isState1 ? 'img/buttons1_right_about.png' : 'img/buttons2_right_about.png';
        }, 500);
    </script>
