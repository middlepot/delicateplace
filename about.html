<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>delicate ♡ place</title>
    <link rel="shortcut icon" href="img/bow.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container about-layout">

        <!-- Logo no topo -->
        <a href="roblox://placeId=129335976071987">
            <div class="logo-container about-logo">
                <img src="img/logo.png" alt="Delicate Place" class="logo">
                <img src="img/animation.gif" alt="Ursinha animada" class="bear">
            </div>
        </a>

        <!-- Caixa central -->
        <div class="about-center-wrapper">
            <!-- Enfeite inclinado -->
            <img src="img/button_about.png" alt="About the dev" class="about-badge">

            <!-- Botões flutuantes laterais -->
            <img src="img/buttons1_left_about.png" alt="Enfeites esquerda" class="about-side-left">
            <img src="img/buttons1_right_about.png" alt="Enfeites direita" class="about-side-right">

            <!-- Caixa de texto com borda e fundo -->
            <div class="about-content-box">
                <p><i>name</i> : puf .. <sub><img src="img/heart.png"></sub></p><br>
                <p><i>i am</i> : an artist, crafter & designer <sub><img src="img/craft.png"></sub></p><br>
                <p><i>born on</i> : august 11 , 1997 <sub><img src="img/clip.png"></sub></p><br>
                <p><i>i wish</i> : to live a beautiful life .. <sub><img src="img/life.png"></sub></p><br>
                <p><i>keepsakes</i> : frills, lace, ribbons, teddy bears <sub><img src="img/lovely.png"></sub></p><br>
                <p><i>aversions</i> : loud noises, intrusive people <sub><img src="img/sad.png"></sub></p><br>
                <p><i>caution</i> : i am on the autism spectrum <sub><img src="img/delicate.png"></sub></p><br>
                <a href="https://status.cafe/users/puf" target="_blank">꒰ you found a fragment ꒱</a>
            </div>
        </div>

    </div>

    <script>
        let isState1 = true;
        const leftBtn = document.querySelector('.about-side-left');
        const rightBtn = document.querySelector('.about-side-right');

        setInterval(() => {
            isState1 = !isState1;
            leftBtn.src = isState1 ? 'img/buttons1_left_about.png' : 'img/buttons2_left_about.png';
            rightBtn.src = isState1 ? 'img/buttons1_right_about.png' : 'img/buttons2_right_about.png';
        }, 500);
    </script>
</body>

</html>
